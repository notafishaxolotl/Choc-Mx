# ─── Display ───────────────────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_NICE_OLED_WIDGET_STATUS=y
CONFIG_NICE_OLED_WIDGET_ANIMATION=y          # enable boot/idle animations
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# ─── Input / Encoders ──────────────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ─── Power ─────────────────────────────────────────────────────────────────────
CONFIG_ZMK_IDLE_TIMEOUT=30000               # dim display after 30 s
CONFIG_ZMK_SLEEP=y                          # deep sleep support
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000        # sleep after 15 min

# ─── RGB Underglow ─────────────────────────────────────────────────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Animation: ripple on key-press
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3        # start on ripple effect (effect index 3)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y         # RGB on at boot

# Default colour & brightness (tweak to taste)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0        # red hue (0–359)
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40       # 40 % – easy on the battery
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3        # ripple speed
